name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            10.0.x

      - name: Restore
        run: dotnet restore Housekeeper.slnx

      - name: Verify formatting
        run: dotnet format Housekeeper.slnx --verify-no-changes --no-restore

      - name: Build (Release)
        run: dotnet build Housekeeper.slnx -c Release --no-restore -warnaserror

      - name: Test
        run: dotnet test Housekeeper.slnx -c Release --no-build --logger "trx;LogFileName=test.trx"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: "**/TestResults/*.trx"
          if-no-files-found: ignore

      - name: Dependency vulnerability scan
        # Surfaces known advisories without hard-failing on un-actionable noise (see SECURITY.md).
        continue-on-error: true
        run: dotnet list Housekeeper.slnx package --vulnerable --include-transitive

  # Both images are built on every push and pull request so a broken Dockerfile, or a .dockerignore that
  # lets a host obj/ overwrite the container's restore, fails here rather than at release time, when a tag
  # has already been pushed. Nothing is pushed from this job.
  docker:
    runs-on: ubuntu-latest
    needs: build-test
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: standalone
            file: deploy/docker/Dockerfile
          - name: addon
            file: housekeeper/Dockerfile
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3

      - name: Build ${{ matrix.name }} image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.file }}
          platforms: linux/amd64
          push: false
          load: true
          tags: housekeeper-${{ matrix.name }}:ci
          cache-from: type=gha,scope=ci-${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=ci-${{ matrix.name }}

      - name: Smoke test ${{ matrix.name }} image
        # The container must come up and answer /health with nothing configured beyond an API token.
        run: |
          docker run -d --name smoke -p 127.0.0.1:5080:5080 \
            -e HOUSEKEEPER_API_TOKEN=ci-smoke-token \
            housekeeper-${{ matrix.name }}:ci
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:5080/health >/dev/null 2>&1; then
              echo "healthy after ${i}s"
              docker rm -f smoke
              exit 0
            fi
            sleep 1
          done
          echo "::error::container did not answer /health within 30s"
          docker logs smoke
          docker rm -f smoke
          exit 1

  # Every push to main publishes a multi-arch "edge" image of the standalone container, so the latest
  # unreleased build is one docker pull away. Versioned tags come from release.yml.
  edge:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    needs: docker
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push edge image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/housekeeper:edge
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=standalone
          cache-to: type=gha,mode=max,scope=standalone
