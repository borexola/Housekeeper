name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            10.0.x

      - name: Restore
        run: dotnet restore HearthSense.slnx

      - name: Verify formatting
        run: dotnet format HearthSense.slnx --verify-no-changes --no-restore

      - name: Build (Release)
        run: dotnet build HearthSense.slnx -c Release --no-restore -warnaserror

      - name: Test
        run: dotnet test HearthSense.slnx -c Release --no-build --logger "trx;LogFileName=test.trx"

      - name: Dependency vulnerability scan
        # Surfaces known advisories without hard-failing on un-actionable noise (see SECURITY.md).
        continue-on-error: true
        run: dotnet list HearthSense.slnx package --vulnerable --include-transitive
