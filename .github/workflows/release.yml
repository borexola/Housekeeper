name: Release

# Builds the images the Home Assistant add-on installs from, one per architecture, because the Supervisor
# substitutes {arch} into a plain image name rather than reading a multi-arch manifest. It also publishes
# the standalone container as one multi-arch image, ghcr.io/<owner>/housekeeper, and opens a GitHub
# release with the matching section of CHANGELOG.md as its notes.
#
# Tag a version to publish:  git tag v0.1.0 && git push origin v0.1.0
# The tag must match the version in housekeeper/config.yaml.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: Version to publish, without the leading v
        required: true

permissions:
  contents: read
  packages: write

jobs:
  # Works out and checks the version once, and runs the tests once, before anything is pushed anywhere.
  version:
    runs-on: ubuntu-latest
    outputs:
      value: ${{ steps.version.outputs.value }}
    steps:
      - uses: actions/checkout@v7

      # The dispatch input arrives through the environment and is never interpolated into the script: ${{ }}
      # is substituted before the shell sees the line, so a version containing $(...) would have run as a
      # command in a job holding packages:write. Its shape is checked before it goes anywhere else.
      - name: Work out the version
        id: version
        env:
          INPUT_VERSION: ${{ github.event.inputs.version }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [ "${EVENT_NAME}" = "workflow_dispatch" ]; then
            version="${INPUT_VERSION}"
          else
            version="${GITHUB_REF_NAME#v}"
          fi

          if ! printf '%s' "${version}" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$'; then
            echo "'${version}' is not a version number like 1.2.3." >&2
            exit 1
          fi

          echo "value=${version}" >> "$GITHUB_OUTPUT"

      - name: Check the tag matches the add-on manifest
        env:
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          declared=$(grep -E '^version:' housekeeper/config.yaml | sed -E 's/version:[[:space:]]*"?([^"]*)"?/\1/')
          if [ "${declared}" != "${VERSION}" ]; then
            echo "housekeeper/config.yaml says ${declared} but this release is ${VERSION}." >&2
            exit 1
          fi

      # An image nobody has run the tests against is not a release. A tag push does not trigger the CI
      # workflow, which is branch-scoped, so the same gate is applied here.
      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: |
            10.0.x

      - name: Build and test
        run: |
          dotnet build Housekeeper.slnx -c Release -warnaserror
          dotnet test Housekeeper.slnx -c Release --no-build

  addon-images:
    runs-on: ubuntu-latest
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - addon_arch: amd64
            platform: linux/amd64
          - addon_arch: aarch64
            platform: linux/arm64

    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: housekeeper/Dockerfile
          platforms: ${{ matrix.platform }}
          provenance: false
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/housekeeper-${{ matrix.addon_arch }}:${{ needs.version.outputs.value }}
            ghcr.io/${{ github.repository_owner }}/housekeeper-${{ matrix.addon_arch }}:latest
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.version=${{ needs.version.outputs.value }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.addon_arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.addon_arch }}

      # GITHUB_TOKEN creates packages private by default, and the Supervisor pulls anonymously. A private
      # image fails to install with a bare "pull access denied", which says nothing about the real cause.
      - name: Remind about package visibility
        run: |
          echo "::notice::If this is the first release, make ghcr.io/${{ github.repository_owner }}/housekeeper-${{ matrix.addon_arch }} public under Packages → Package settings. The Home Assistant Supervisor pulls anonymously and cannot install a private image."

  # The standalone container, for Home Assistant Container and everyone not on the Supervisor. One image,
  # one multi-arch manifest, the same tag as the release.
  standalone-image:
    runs-on: ubuntu-latest
    needs: version
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/housekeeper:${{ needs.version.outputs.value }}
            ghcr.io/${{ github.repository_owner }}/housekeeper:latest
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.version=${{ needs.version.outputs.value }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=standalone
          cache-to: type=gha,mode=max,scope=standalone

  github-release:
    runs-on: ubuntu-latest
    needs: [version, addon-images, standalone-image]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: Extract release notes from the changelog
        env:
          VERSION: ${{ needs.version.outputs.value }}
          OWNER: ${{ github.repository_owner }}
        run: |
          # Everything between "## [VERSION]" and the next "## [" heading; falls back to a pointer.
          awk -v v="${VERSION}" '
            index($0, "## [" v "]") == 1 { on = 1; next }
            on && /^## \[/ { exit }
            on { print }
          ' CHANGELOG.md > notes.md
          if [ ! -s notes.md ]; then
            echo "See CHANGELOG.md for what changed in ${VERSION}." > notes.md
          fi
          {
            echo
            echo "**Images**"
            echo
            echo "- \`ghcr.io/${OWNER}/housekeeper:${VERSION}\` (standalone, amd64 + arm64)"
            echo "- \`ghcr.io/${OWNER}/housekeeper-amd64:${VERSION}\` and \`housekeeper-aarch64\` (Home Assistant add-on)"
          } >> notes.md

      - uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ needs.version.outputs.value }}
          name: Housekeeper ${{ needs.version.outputs.value }}
          body_path: notes.md
          prerelease: ${{ contains(needs.version.outputs.value, '-') }}
