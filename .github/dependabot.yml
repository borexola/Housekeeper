# Keeps the actions, NuGet packages, and base images current. Updates are grouped so a routine bump is one
# review rather than five.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: nuget
    directory: /
    schedule:
      interval: weekly
    groups:
      nuget:
        patterns: ["*"]

  - package-ecosystem: docker
    directories:
      - /deploy/docker
      - /housekeeper
    schedule:
      interval: weekly
