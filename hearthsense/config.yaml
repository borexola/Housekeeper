# Home Assistant add-on manifest.
#
# Before this can be installed, replace OWNER below (and in repository.yaml) with the GitHub account
# that hosts the published images, then push a tag so the release workflow builds them.
name: HearthSense
version: "0.1.0"
slug: hearthsense
description: Describe an automation in plain English, review the YAML, then it goes live.
url: https://github.com/OWNER/HearthSense
image: ghcr.io/OWNER/hearthsense-{arch}

arch:
  - amd64
  - aarch64

init: false
startup: application
boot: auto

# Reached only through the sidebar. The port is not published, so nothing on your network can touch it.
ingress: true
ingress_port: 5080
panel_icon: mdi:home-lightning-bolt
panel_title: HearthSense

# Lets the add-on use the Supervisor's own credentials instead of asking you for a token.
homeassistant_api: true

options:
  home_assistant_token: ""
  log_level: info

schema:
  home_assistant_token: password?
  log_level: list(trace|debug|info|warning|error)
